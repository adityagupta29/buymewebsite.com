<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1200px;height:630px;overflow:hidden;background:#0a0a0a;}
  body{
    font-family:'Outfit',Arial,sans-serif;
    position:relative;
    color:#f5f5f5;
  }
  .grid-bg{
    position:absolute; inset:0;
    background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),
      linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);
    background-size:56px 56px;
  }
  .glow{position:absolute; width:700px;height:700px; background:#d4ff3a; opacity:.16; filter:blur(140px); border-radius:50%; top:50%; left:50%; transform:translate(-50%,-50%);}

  /* Everything centered so a square center-crop (WhatsApp etc.) never cuts anything important */
  .wrap{position:relative; z-index:2; width:100%; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:40px;}

  .brand{display:flex; align-items:center; gap:14px; margin-bottom:36px;}
  .logo{width:48px;height:48px;border-radius:13px;background:#d4ff3a;display:flex;align-items:center;justify-content:center;font-family:'Syne',sans-serif;font-weight:800;font-size:26px;color:#000;}
  .brand-name{font-family:'Syne',sans-serif;font-weight:700;font-size:26px;letter-spacing:-.02em;}
  .brand-name .dot{color:#d4ff3a;}

  .headline{font-family:'Syne',sans-serif;font-weight:800;letter-spacing:-.02em;font-size:64px;line-height:1.08;}
  .headline .accent{
    background:linear-gradient(135deg,#d4ff3a 0%, #ffffff 50%, #ff5722 100%);
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; color:transparent;
  }

  .sub{font-size:24px; color:rgba(245,245,245,.7); margin-top:24px; font-weight:400;}

  .pill{display:inline-flex; align-items:center; gap:10px; padding:11px 24px; border-radius:100px; background:rgba(212,255,58,.08); border:1.5px solid rgba(212,255,58,.4); font-size:20px; font-weight:600; color:#d4ff3a; margin-top:34px;}
  .dot-pulse{width:9px;height:9px;background:#d4ff3a;border-radius:50%;}

  .domain{font-family:'Syne',sans-serif; font-weight:700; font-size:22px; color:rgba(255,255,255,.55); margin-top:28px;}
  .domain .dot{color:#d4ff3a;}
</style>
</head>
<body>
  <div class="grid-bg"></div>
  <div class="glow"></div>
  <div class="wrap">
    <div class="brand">
      <div class="logo">B</div>
      <div class="brand-name">BuyMeWebsite<span class="dot">.</span>com</div>
    </div>

    <div class="headline">Premium Sites.<br><span class="accent">Half the Market.</span></div>
    <div class="sub">Websites from ₹5,000 · Domain + Hosting Included</div>

    <div class="pill"><span class="dot-pulse"></span> 10% Advance Only</div>
    <div class="domain">buymewebsite<span class="dot">.</span>com</div>
  </div>
</body>
</html>
